<script>
    function renderDispenserGrid() {
      const grid = document.getElementById('dispenser-grid'); if (!grid) return;
      document.getElementById('dispenser-section-title').textContent = `Dispenser Boxes [${currentDispenserView.toUpperCase()} VIEW]`;
      let gtTickets = 0, gtSales = 0;

      if (currentDispenserView === 'list') {
        grid.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden';
        grid.innerHTML = `
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead class="bg-slate-100 text-slate-700 uppercase font-bold border-b">
                <tr><th class="p-2.5 text-center w-16">Box #</th><th class="p-2.5 text-center w-20">Game #</th><th class="p-2.5">Game Name</th><th class="p-2.5 text-center w-16">Price</th><th class="p-2.5 text-center w-20">Start</th><th class="p-2.5 text-center w-24 text-blue-700">End Ticket</th><th class="p-2.5 text-center w-20">Sold</th><th class="p-2.5 text-right">Total $</th><th class="p-2.5 text-center w-24">Actions</th></tr>
              </thead>
              <tbody class="divide-y">
                ${boxes.map((box, idx) => {
                  const m = calculateBoxMetrics(box); gtTickets += m.ticketsSold; gtSales += m.salesAmount;
                  return `
                    <tr class="hover:bg-slate-50 ${m.isError ? 'bg-red-50' : ''}">
                      <td class="p-2 text-center font-black"><input type="text" id="input-boxNum-${idx}" value="${box.boxNumber}" onchange="updateBoxLabel(${idx}, this.value)" onkeydown="handleGridEnter(event, ${idx}, 'boxNum')" ${isBoxSetupLocked ? 'disabled' : ''} class="w-12 text-center font-bold bg-slate-900 text-white rounded p-1 text-xs"></td>
                      <td class="p-2 text-center font-mono font-bold"><input type="text" id="input-gameNum-${idx}" value="${box.gameNum || ''}" onchange="assignGameToBox(${idx}, this.value)" onkeydown="handleGridEnter(event, ${idx}, 'gameNum')" ${isBoxSetupLocked ? 'disabled' : ''} class="w-16 text-center font-mono font-bold border rounded p-1 bg-slate-50"></td>
                      <td class="p-2 font-medium truncate max-w-[200px]">${box.gameName || '<span class="text-gray-400">Unassigned</span>'}</td>
                      <td class="p-2 text-center font-bold text-emerald-700">${box.price > 0 ? `$${box.price}` : '-'}</td>
                      <td class="p-2 text-center font-mono font-bold"><input type="number" id="input-startTicket-${idx}" value="${box.startTicket}" onchange="updateBoxField(${idx}, 'startTicket', this.value)" onkeydown="handleGridEnter(event, ${idx}, 'startTicket')" ${isBoxSetupLocked ? 'disabled' : ''} class="w-16 text-center font-mono border rounded p-1"></td>
                      <td class="p-2 text-center font-mono"><input type="number" id="input-endTicket-${idx}" value="${box.endTicket}" oninput="updateBoxEndTicketLive(${idx}, this.value)" onblur="checkAutoRollover(${idx}, this.value)" onkeydown="handleGridEnter(event, ${idx}, 'endTicket')" class="w-20 text-center font-mono font-bold border border-blue-400 bg-blue-50/50 rounded p-1"></td>
                      <td class="p-2 text-center font-bold" id="box-sold-${idx}">${m.ticketsSold}</td>
                      <td class="p-2 text-right font-mono font-black text-emerald-700" id="box-sales-${idx}">$${m.salesAmount.toFixed(2)}</td>
                      <td class="p-2 text-center space-x-1">
                        <button onclick="initScanner(${idx})" class="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-1 rounded font-semibold border border-blue-200">Scan</button>
                        ${!isBoxSetupLocked ? `<button onclick="removeBox(${idx})" class="text-[10px] bg-red-50 text-red-600 px-1.5 py-1 rounded font-semibold border border-red-200">×</button>` : ''}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
              <tfoot class="bg-slate-200 text-slate-900 font-black border-t-2 border-slate-400">
                <tr>
                  <td colspan="6" class="p-2.5 text-right uppercase tracking-wider">Shift Grand Total:</td>
                  <td class="p-2.5 text-center text-sm" id="list-total-sold">${gtTickets}</td>
                  <td class="p-2.5 text-right text-sm text-emerald-700" id="list-total-sales">$${gtSales.toFixed(2)}</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        `;
      } else {
        grid.className = 'box-grid';
        grid.innerHTML = boxes.map((box, idx) => {
          const m = calculateBoxMetrics(box); gtTickets += m.ticketsSold; gtSales += m.salesAmount;
          return `
            <div class="bg-white rounded-xl p-3 shadow-sm border ${m.isError ? 'border-red-500 ring-1 ring-red-400' : 'border-gray-200'} flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center mb-2">
                  <div class="flex items-center gap-1.5"><span class="text-xs font-black uppercase text-slate-600">Box</span><input type="text" id="input-boxNum-${idx}" value="${box.boxNumber}" onchange="updateBoxLabel(${idx}, this.value)" onkeydown="handleGridEnter(event, ${idx}, 'boxNum')" ${isBoxSetupLocked ? 'disabled' : ''} class="w-16 text-center text-xs font-black uppercase px-1.5 py-0.5 rounded bg-slate-900 text-white border border-slate-700"></div>
                  <div class="flex items-center gap-1">${box.price > 0 ? `<span class="text-xs font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">$${box.price}</span>` : ''}<button onclick="initScanner(${idx})" class="text-[11px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-semibold border border-blue-200">Scan</button>${!isBoxSetupLocked ? `<button onclick="removeBox(${idx})" class="text-[11px] text-gray-400 hover:text-red-600 px-1 font-bold">×</button>` : ''}</div>
                </div>
                <div class="grid grid-cols-3 gap-1.5 mb-2">
                  <div><label class="block text-[10px] uppercase font-bold text-gray-500">Game #</label><input type="text" id="input-gameNum-${idx}" value="${box.gameNum || ''}" onchange="assignGameToBox(${idx}, this.value)" onkeydown="handleGridEnter(event, ${idx}, 'gameNum')" ${isBoxSetupLocked ? 'disabled' : ''} class="w-full border rounded p-1.5 font-mono text-xs font-bold bg-slate-50"></div>
                  <div class="col-span-2"><label class="block text-[10px] uppercase font-bold text-gray-500">Game Name</label><div class="w-full border rounded p-1.5 text-xs font-semibold bg-gray-100 text-slate-700 truncate h-[30px] flex items-center">${box.gameName || '<span class="text-gray-400">Enter Game #</span>'}</div></div>
                </div>
                <div class="grid grid-cols-2 gap-1.5 mb-2">
                  <div><label class="block text-[10px] uppercase font-bold text-gray-500">Start Tkt #</label><input type="number" id="input-startTicket-${idx}" value="${box.startTicket}" onchange="updateBoxField(${idx}, 'startTicket', this.value)" onkeydown="handleGridEnter(event, ${idx}, 'startTicket')" ${isBoxSetupLocked ? 'disabled' : ''} class="w-full border rounded p-1.5 font-mono text-sm font-bold"></div>
                  <div><label class="block text-[10px] uppercase font-bold text-blue-700">End Tkt #</label><input type="number" id="input-endTicket-${idx}" value="${box.endTicket}" oninput="updateBoxEndTicketLive(${idx}, this.value)" onblur="checkAutoRollover(${idx}, this.value)" onkeydown="handleGridEnter(event, ${idx}, 'endTicket')" class="w-full border border-blue-400 rounded p-1.5 font-mono text-sm font-bold bg-blue-50/30"></div>
                </div>
              </div>
              <div class="pt-2 border-t flex items-center justify-between text-xs">
                <div><span class="text-gray-500">Sold: <strong id="box-sold-${idx}" class="text-slate-900">${m.ticketsSold}</strong></span><span id="box-sales-${idx}" class="ml-2 font-black text-emerald-700">$${m.salesAmount.toFixed(2)}</span></div>
                <button onclick="rollNewPackInBox(${idx})" class="text-[11px] bg-slate-800 text-white px-2 py-1 rounded font-semibold">Roll Pack</button>
              </div>
            </div>
          `;
        }).join('');
      }
      document.getElementById('action-bar-sales').textContent = `$${gtSales.toFixed(2)}`;
    }

    function updateBoxField(idx, field, val) { if (boxes[idx]) { boxes[idx][field] = val === '' ? '' : Number(val); saveBoxesState(); renderDispenserGrid(); } }
    function addBox() { if (isBoxSetupLocked) return alert('Unlock Box Setup first.'); boxes.push(createEmptyBox(boxes.length + 1)); saveBoxesState(); renderDispenserGrid(); }
    
    // SAFE DELETE WITH "DELETE" CONFIRMATION PROMPT
    function removeBox(idx) {
      if (isBoxSetupLocked) return alert('Unlock Box Setup first.');
      const confirmation = prompt(`TYPE "DELETE" TO CONFIRM REMOVAL OF BOX ${boxes[idx].boxNumber}:`);
      if (confirmation !== 'DELETE') return;
      boxes.splice(idx, 1); saveBoxesState(); renderDispenserGrid();
    }

    function updateBoxLabel(idx, newVal) { if (boxes[idx]) { boxes[idx].boxNumber = String(newVal || '').trim().toUpperCase(); saveBoxesState(); renderDispenserGrid(); } }
    
    function assignGameToBox(idx, gameNumInput) {
      const box = boxes[idx]; if (!box) return; const cleaned = String(gameNumInput || '').trim();
      const game = masterGames.find(g => String(g.gameNum).trim() === cleaned);
      if (game) { box.gameNum = game.gameNum; box.gameName = game.name; box.price = Number(game.price); box.rollCount = Number(game.count); if (box.startTicket === '') box.startTicket = 0; }
      else if (cleaned === '') { box.gameNum = ''; box.gameName = ''; box.price = 0; box.rollCount = 0; }
      else { box.gameNum = cleaned; box.gameName = 'Not Found - Update Admin'; box.price = 0; box.rollCount = 0; }
      saveBoxesState(); renderDispenserGrid();
    }

    function clearAllEndTickets() { if (confirm('Clear all End Tickets?')) { boxes.forEach(b => b.endTicket = ''); saveBoxesState(); renderDispenserGrid(); } }
    
    function runValidation() {
      const banner = document.getElementById('validation-banner'); const errors = [];
      boxes.forEach(b => { const m = calculateBoxMetrics(b); if (m.isError) errors.push(`Box ${b.boxNumber}: ${m.errorMsg}`); });
      banner.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-300', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-300');
      if (errors.length > 0) { banner.classList.add('bg-red-50', 'text-red-800', 'border-red-300'); banner.innerHTML = `<strong>Issues:</strong> ${errors.join(' • ')}`; }
      else { banner.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-300'); banner.textContent = 'All active boxes passed validation!'; setTimeout(() => banner.classList.add('hidden'), 4000); }
    }

    function openStoreDrawer() { document.getElementById('store-drawer').classList.remove('hidden'); }
    function closeStoreDrawer() { document.getElementById('store-drawer').classList.add('hidden'); }
    function openAdminModal() { renderAdminGamesTable(); document.getElementById('admin-modal').classList.remove('hidden'); }
    function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
    function openOcrModal() { document.getElementById('ocr-modal').classList.remove('hidden'); }
    function closeOcrModal() { document.getElementById('ocr-modal').classList.add('hidden'); }
    function openReconcileModal() { updateReconcileMath(); document.getElementById('reconcile-modal').classList.remove('hidden'); }
    function closeReconcileModal() { document.getElementById('reconcile-modal').classList.add('hidden'); }
    
    function openRapidEntryModal() {
      document.getElementById('rapid-entry-list').innerHTML = boxes.map((b, idx) => `
        <div class="py-2 flex items-center justify-between gap-3 text-xs">
          <div class="w-48 font-semibold truncate"><span class="font-black">Box ${b.boxNumber}:</span> ${b.gameNum ? `#${b.gameNum} ($${b.price})` : 'Empty'}</div>
          <div class="text-gray-500 font-mono">Start: <strong>${b.startTicket !== '' ? b.startTicket : '-'}</strong></div>
          <div class="flex items-center gap-1.5"><label class="font-bold text-blue-700">End #:</label><input type="number" id="rapid-end-${idx}" value="${b.endTicket}" class="w-24 border border-blue-400 rounded p-1.5 font-mono font-bold text-sm"></div>
        </div>
      `).join('');
      document.getElementById('rapid-entry-modal').classList.remove('hidden');
    }
    function closeRapidEntryModal() { document.getElementById('rapid-entry-modal').classList.add('hidden'); }
    function saveRapidEntry() { boxes.forEach((b, idx) => { const el = document.getElementById(`rapid-end-${idx}`); if (el) b.endTicket = el.value === '' ? '' : Number(el.value); }); saveBoxesState(); renderDispenserGrid(); closeRapidEntryModal(); }

    function renderAdminGamesTable() {
      const tbody = document.getElementById('admin-games-tbody'); if (!tbody) return;
      tbody.innerHTML = masterGames.map((g, idx) => `
        <tr class="hover:bg-slate-50">
          <td class="p-2.5 font-mono font-bold">#${g.gameNum}</td>
          <td class="p-2.5">${g.name}</td>
          <td class="p-2.5 text-emerald-700 font-bold">$${g.price.toFixed(2)}</td>
          <td class="p-2.5">${g.count} tkts</td>
          <td class="p-2.5 font-mono text-gray-500">${Math.max(0, g.count - 1)}</td>
          <td class="p-2.5 text-right space-x-2"><button onclick="deleteMasterGame(${idx})" class="text-red-600 font-semibold">Delete</button></td>
        </tr>
      `).join('');
    }
    function saveMasterGame() {
      const gameNum = document.getElementById('admin-game-num').value.trim(); const name = document.getElementById('admin-game-name').value.trim();
      const price = Number(document.getElementById('admin-game-price').value); const count = Number(document.getElementById('admin-game-count').value) || getDefaultRollCountForPrice(price);
      if (!gameNum || !name || price <= 0) return alert('Enter valid details.');
      const existing = masterGames.findIndex(g => String(g.gameNum) === gameNum);
      if (existing >= 0) masterGames[existing] = { gameNum, name, price, count }; else masterGames.push({ gameNum, name, price, count });
      saveGamesState(); renderAdminGamesTable(); renderDispenserGrid();
    }
    function deleteMasterGame(idx) { masterGames.splice(idx, 1); saveGamesState(); renderAdminGamesTable(); renderDispenserGrid(); }
    function resetDefaultGames() { masterGames = JSON.parse(JSON.stringify(DEFAULT_GAMES)); saveGamesState(); renderAdminGamesTable(); renderDispenserGrid(); }

    function updateReconcileMath() {
      let scratchSales = 0, totalTickets = 0;
      boxes.forEach(b => { const m = calculateBoxMetrics(b); scratchSales += m.salesAmount; totalTickets += m.ticketsSold; });
      const onlineSales = Number(document.getElementById('rec-online-sales').value) || 0;
      const payouts = Number(document.getElementById('rec-payouts').value) || 0;
      const posActual = Number(document.getElementById('rec-pos-actual').value) || 0;
      const expectedNet = scratchSales + onlineSales - payouts; const variance = posActual - expectedNet;
      document.getElementById('rec-scratch-sales').textContent = `$${scratchSales.toFixed(2)}`;
      document.getElementById('rec-tickets-sold').textContent = `${totalTickets} tickets sold`;
      document.getElementById('rec-expected-total').textContent = `$${expectedNet.toFixed(2)}`;
      document.getElementById('rec-accounted-total').textContent = `$${posActual.toFixed(2)}`;
      const varEl = document.getElementById('rec-variance-display');
      varEl.textContent = `${variance >= 0 ? '+' : ''}$${variance.toFixed(2)}`;
      varEl.className = variance === 0 ? 'text-emerald-700 font-black' : (variance < 0 ? 'text-red-600 font-black' : 'text-blue-700 font-black');
    }

    function commitShiftRollover() {
      if (!confirm('Lock this shift and roll all End Tickets to Start Tickets?')) return;
      boxes.forEach(b => { if (b.endTicket !== '' && b.endTicket != null) { b.startTicket = Number(b.endTicket); b.endTicket = ''; } b.rollovers = []; });
      saveBoxesState(); renderDispenserGrid(); closeReconcileModal(); alert('Shift rolled over successfully.');
    }

    function emailShiftReport() {
      window.location.href = `mailto:${storeProfile.email}?subject=${encodeURIComponent('Lottery Shift Report')}&body=${encodeURIComponent('Shift Reconciliation Summary')}`;
    }

    function initSignaturePad() {
      sigCanvas = document.getElementById('signature-pad'); if (!sigCanvas) return;
      sigCtx = sigCanvas.getContext('2d'); sigCtx.strokeStyle = '#0f172a'; sigCtx.lineWidth = 2;
      const start = (e) => { isDrawingSig = true; sigCtx.beginPath(); const p = getSigPos(e); sigCtx.moveTo(p.x, p.y); };
      const move = (e) => { if (!isDrawingSig) return; e.preventDefault(); const p = getSigPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
      const end = () => { isDrawingSig = false; };
      sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      sigCanvas.addEventListener('touchstart', start, { passive: false }); sigCanvas.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', end);
    }
    function getSigPos(e) {
      const rect = sigCanvas.getBoundingClientRect();
      return { x: ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (sigCanvas.width / rect.width), y: ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) * (sigCanvas.height / rect.height) };
    }
    function clearSignature() { if (sigCtx && sigCanvas) sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function initScanner(boxIdx) {
      activeScannerBoxIndex = boxIdx; document.getElementById('scanner-modal').classList.remove('hidden');
      if (window.Html5Qrcode) { html5QrCode = new Html5Qrcode('reader'); html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 120 } }, (txt) => handleBarcodeString(txt)).catch(() => {}); }
    }
    function stopScanner() { if (html5QrCode) html5QrCode.stop().catch(() => {}).finally(() => html5QrCode = null); document.getElementById('scanner-modal').classList.add('hidden'); }
    function processManualBarcode() { const val = document.getElementById('manual-barcode-input').value.trim(); if (val) handleBarcodeString(val); }
    function handleBarcodeString(raw) {
      const digits = raw.replace(/\D/g, ''); if (digits.length < 6) return alert('Barcode too short.');
      const gameNum = digits.slice(0, 3); const tkt = Number(digits.slice(-3));
      let idx = activeScannerBoxIndex !== null ? activeScannerBoxIndex : boxes.findIndex(b => String(b.gameNum) === gameNum);
      if (idx === -1) return alert(`No box found for Game #${gameNum}`);
      boxes[idx].endTicket = tkt; saveBoxesState(); renderDispenserGrid(); stopScanner();
    }

    function togglePrintFormat() {
      currentPrintFormat = currentPrintFormat === 'list' ? 'box' : 'list';
      document.getElementById('btn-print-format').textContent = `Print Format: ${currentPrintFormat === 'list' ? 'List View' : 'Box Cards'}`;
    }

    function buildListPrintHTML() {
      let gtTickets = 0, gtSales = 0;
      const rows = boxes.map(b => {
        const m = calculateBoxMetrics(b); gtTickets += m.ticketsSold; gtSales += m.salesAmount;
        return `
          <tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 4px; text-align: center; font-weight: bold;">${b.boxNumber}</td>
            <td style="padding: 4px; text-align: center; font-family: monospace;">${b.gameNum || ''}</td>
            <td style="padding: 4px;">${b.gameName || ''}</td>
            <td style="padding: 4px; text-align: center;">${b.price ? '$'+b.price : ''}</td>
            <td style="padding: 4px; text-align: center; font-family: monospace;">${b.startTicket !== '' ? b.startTicket : ''}</td>
            <td style="padding: 4px; text-align: center; font-family: monospace; font-weight: bold;">${b.endTicket !== '' ? b.endTicket : ''}</td>
            <td style="padding: 4px; text-align: center;">${m.ticketsSold}</td>
            <td style="padding: 4px; text-align: right; font-family: monospace; font-weight: bold;">$${m.salesAmount.toFixed(2)}</td>
          </tr>
        `;
      }).join('');
      return `
        <div style="font-family: Arial, sans-serif; padding: 10px; color: #000;">
          <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px;">
            <div>
              <h2 style="margin: 0; font-size: 16px; font-weight: bold;">${storeProfile.name} (#${storeProfile.number})</h2>
              <p style="margin: 4px 0 0 0; font-size: 12px;">Shift Audit Worksheet — Shift: ${document.getElementById('header-shift-badge')?.textContent || 'Shift A'}</p>
            </div>
            <div style="text-align: right; font-size: 11px;">
              <p style="margin: 0;">Date: ${new Date().toLocaleDateString()}</p>
              <p style="margin: 2px 0 0 0;">Time: ${new Date().toLocaleTimeString()}</p>
            </div>
          </div>
          <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
            <thead>
              <tr style="background-color: #f1f5f9; border-bottom: 2px solid #000;">
                <th style="padding: 5px; text-align: center;">Box</th><th style="padding: 5px; text-align: center;">Game</th>
                <th style="padding: 5px; text-align: left;">Name</th><th style="padding: 5px; text-align: center;">$</th>
                <th style="padding: 5px; text-align: center;">Start</th><th style="padding: 5px; text-align: center;">End</th>
                <th style="padding: 5px; text-align: center;">Sold</th><th style="padding: 5px; text-align: right;">Total $</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
              <tr style="border-top: 2px solid #000; font-weight: bold; font-size: 12px; background-color: #f8fafc;">
                <td colspan="6" style="padding: 6px; text-align: right;">GRAND TOTALS:</td>
                <td style="padding: 6px; text-align: center;">${gtTickets}</td>
                <td style="padding: 6px; text-align: right;">$${gtSales.toFixed(2)}</td>
              </tr>
            </tfoot>
          </table>
          <div style="margin-top: 30px; display: flex; justify-content: space-between; gap: 40px;">
            <div style="flex: 1;"><div style="border-bottom: 1px solid #000; height: 25px;"></div><p style="margin-top: 4px; font-size: 11px; text-align: center;">Cashier Signature</p></div>
            <div style="flex: 1;"><div style="border-bottom: 1px solid #000; height: 25px;"></div><p style="margin-top: 4px; font-size: 11px; text-align: center;">Manager Signature</p></div>
          </div>
        </div>
      `;
    }

    function buildBoxCardsPrintHTML() {
      let gtSales = 0;
      const cards = boxes.map(b => {
        const m = calculateBoxMetrics(b); gtSales += m.salesAmount;
        return `
          <div class="print-box-card">
            <div style="display:flex; justify-content:space-between; font-weight:bold; border-bottom:1px solid #000; padding-bottom:2px; margin-bottom:3px;">
              <span>Box ${b.boxNumber}</span><span>${b.price ? '$'+b.price : ''}</span>
            </div>
            <div><strong>Game:</strong> #${b.gameNum || '-'}</div>
            <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><strong>Name:</strong> ${b.gameName || 'Unassigned'}</div>
            <div><strong>Start:</strong> ${b.startTicket !== '' ? b.startTicket : '-'}</div>
            <div><strong>End:</strong> ${b.endTicket !== '' ? b.endTicket : '-'}</div>
            <div style="border-top:1px dashed #ccc; margin-top:2px; padding-top:2px; text-align:right; font-weight:bold;">Sold: $${m.salesAmount.toFixed(2)}</div>
          </div>
        `;
      }).join('');
      return `
        <div style="font-family: Arial, sans-serif; padding: 10px; color: #000;">
          <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px;">
            <div>
              <h2 style="margin: 0; font-size: 15px; font-weight: bold;">${storeProfile.name} (#${storeProfile.number}) — Box Cards Audit</h2>
              <p style="margin: 2px 0 0 0; font-size: 11px;">Printed: ${new Date().toLocaleString()}</p>
            </div>
            <div style="font-weight: bold; font-size: 12px;">Total Sales: $${gtSales.toFixed(2)}</div>
          </div>
          <div class="print-box-grid">${cards}</div>
        </div>
      `;
    }

    function printWorksheet() {
      document.getElementById('print-container').innerHTML = currentPrintFormat === 'list' ? buildListPrintHTML() : buildBoxCardsPrintHTML();
      window.print();
    }
    
    function printFinalReport() {
      const shiftType = document.getElementById('rec-shift-type')?.value || 'Shift Audit';
      const outCashier = document.getElementById('rec-cashier-out')?.value || '-';
      const inCashier = document.getElementById('rec-cashier-in')?.value || '-';
      const extras = `
        <div style="margin-top: 14px; font-family: Arial, sans-serif; font-size: 12px; border: 1px solid #000; padding: 10px;">
          <h3 style="margin:0 0 4px 0; font-size:13px;">Financial Reconciliation (${shiftType})</h3>
          <p style="margin: 2px 0;"><strong>Outgoing Cashier:</strong> ${outCashier} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>Incoming Cashier:</strong> ${inCashier}</p>
          <p style="margin: 2px 0;"><strong>Expected Net:</strong> ${document.getElementById('rec-expected-total')?.textContent} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>POS Actual:</strong> ${document.getElementById('rec-accounted-total')?.textContent}</p>
          <p style="margin: 2px 0; font-weight:bold;">Variance: ${document.getElementById('rec-variance-display')?.textContent}</p>
        </div>
      `;
      document.getElementById('print-container').innerHTML = buildListPrintHTML() + extras;
      window.print();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
